[project]
name = "hotornot"
version = "0.1.0"
description = "HotOrNot pipeline: harmonized MODIS and VIIRS fire hotspots"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "shapely>=2.0",
]

[project.scripts]
hotornot = "hotornot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hotornot"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["I"]
